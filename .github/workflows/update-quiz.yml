name: 每日错题自动归档
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 保存当日题库
        run: |
          DATE="${{ github.event.issue.title }}"
          cat > questions-$DATE.json << 'EOF'
          ${{ github.event.issue.body }}
          EOF

      - name: 更新首页日期列表
        run: |
          cat > index.html << 'HTMLEND'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>物理错题练习集</title>
          <link rel="stylesheet" href="style.css">
          </head>
          <body>
          <div class="container">
            <h2>九年级物理错题练习集</h2>
            <ul class="date-list">
          HTMLEND

          for file in $(ls questions-*.json 2>/dev/null | sort -r); do
            d=$(echo $file | sed 's/questions-//;s/.json//')
            echo "              <li><a href='quiz.html?date=$d'>$d 错题练习</a></li>" >> index.html
          done

          cat >> index.html << 'HTMLEND'
            </ul>
          </div>
          </body>
          </html>
          HTMLEND

      - name: 提交更新
        run: |
          git config user.name "AutoBot"
          git config user.email "bot@example.com"
          git add .
          git commit -m "新增当日错题练习"
          git push
