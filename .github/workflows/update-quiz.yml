name: 每日错题自动归档
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 提取日期并保存题库
        run: |
          DATE="${{ github.event.issue.title }}"
          echo "DATE=$DATE" >> $GITHUB_ENV
          cat > questions-$DATE.json << 'EOF'
          ${{ github.event.issue.body }}
          EOF

      - name: 生成当日答题页面
        run: |
          UPDATE_TIME=$(date +"%H:%M")
          cat > quiz-$DATE.html << HTMLEOF
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>物理错题练习 - $DATE</title>
          <link rel="stylesheet" href="style.css">
          </head>
          <body>
          <div class="container">
            <div class="header">
              <h2>九年级物理错题练习</h2>
              <p class="date-info">练习日期：$DATE | 更新时间：$UPDATE_TIME</p>
            </div>
            <div id="quizBox"></div>
            <button id="submitBtn">提交答卷</button>
            <div id="resultBox"></div>
          </div>
          <script>
          let questions = [];
          fetch("questions-$DATE.json")
          .then(res=>res.json())
          .then(data=>{
            questions=data;
            renderQuiz();
          })
          function renderQuiz(){
            const box=document.getElementById("quizBox");
            box.innerHTML="";
            questions.forEach((q,idx)=>{
              let html=`<div class="q-item"><div class="q-title">\${idx+1}. \${q.question}</div>`;
              q.options.forEach((opt,i)=>{
                html+=`<label class="opt"><input type="\${q.type==='multi'?'checkbox':'radio'}" name="q\${idx}" value="\${String.fromCharCode(65+i)}"> \${String.fromCharCode(65+i)}. \${opt}</label>`;
              });
              html+=`<div class="ans-hint" id="hint\${idx}" style="display:none"></div></div>`;
              box.innerHTML+=html;
            });
          }
          document.getElementById("submitBtn").onclick=()=>{
            let score=0,total=questions.length;
            questions.forEach((q,idx)=>{
              const inputs=document.querySelectorAll(`input[name="q\${idx}"]:checked`);
              let userAns=Array.from(inputs).map(i=>i.value).sort().join("");
              let rightAns=q.answer.split("").sort().join("");
              const hint=document.getElementById(`hint\${idx}`);
              if(userAns===rightAns){
                score++;
                hint.innerHTML=`✅ 正确<br>解析：\${q.desc}`;
                hint.style.color="#228b22";
              }else{
                hint.innerHTML=`❌ 错误，标准答案：\${q.answer}<br>解析：\${q.desc}`;
                hint.style.color="#dc2626";
              }
              hint.style.display="block";
            });
            document.getElementById("resultBox").innerHTML=`<h3>得分：\${score}/\${total}</h3>`;
          }
          </script>
          </body>
          </html>
          HTMLEOF

      - name: 生成首页索引（所有历史日期）
        run: |
          echo '<!DOCTYPE html>
          <html lang="zh-CN">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>物理错题练习集</title>
          <link rel="stylesheet" href="style.css">
          </head>
          <body>
          <div class="container">
            <h2>九年级物理错题练习集</h2>
            <ul class="date-list">' > index.html
          
          for file in $(ls quiz-*.html 2>/dev/null | sort -r); do
            date=$(echo $file | sed 's/quiz-//;s/.html//')
            echo "<li><a href='$file'>$date 错题练习</a></li>" >> index.html
          done
          
          echo '</ul>
          </div>
          </body>
          </html>' >> index.html

      - name: 提交并更新
        run
