<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陈佳怡九年级错题练习</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: #f5f7fb;
            padding: 16px;
        }
        .header-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px #00000012;
        }
        .header-card h1 {
            font-size: 24px;
            color: #222;
            margin-bottom: 8px;
        }
        .date-text {
            color: #666;
            font-size: 16px;
        }
        .question-item {
            background: #fff;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: 0 2px 6px #0000000f;
        }
        .subject-tag {
            display: inline-block;
            background: #e8f4ff;
            color: #2078c9;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom:10px;
        }
        .q-title {
            font-size: 16px;
            line-height:1.6;
            margin-bottom:12px;
        }
        .option {
            padding:10px 12px;
            border:1px solid #e2e8f0;
            border-radius:8px;
            margin:8px 0;
            cursor:pointer;
        }
        .option:hover {
            background-color:#f8faff;
        }
        .option.right {
            background:#e6f9ed;
            border-color:#42b983;
        }
        .option.wrong {
            background:#ffeef0;
            border-color:#f56c6c;
        }
        .analysis {
            margin-top:12px;
            padding:10px;
            background:#f7f8fa;
            border-radius:8px;
            color:#444;
            display:none;
        }
    </style>
</head>
<body>
    <div class="header-card">
        <h1>陈佳怡九年级错题练习</h1>
        <div class="date-text" id="showDate">练习日期：--</div>
    </div>
    <div id="question-container"></div>

<script>
function renderQuiz(data){
    document.getElementById("showDate").innerText = "练习日期：" + data.date;
    const wrap = document.getElementById("question-container");
    let html = "";
    data.questions.forEach((q,idx)=>{
        html += `
        <div class="question-item">
            <span class="subject-tag">${q.subject}</span>
            <div class="q-title">${idx+1}. ${q.stem}</div>
        `;
        if(q.type === "choice"){
            q.options.forEach((opt,oi)=>{
                const label = String.fromCharCode(65+oi);
                html += `<div class="option" data-q="${idx}" data-ans="${label}">${label}. ${opt}</div>`
            })
        }else if(q.type === "fill"){
            html += `<div style="padding:10px;border:1px #ccc dashed;border-radius:8px;">填空作答：________</div>`
        }
        html += `<div class="analysis" id="an${idx}">✅ 正确答案：${q.answer}<br>解析：${q.analysis}</div></div>`
    })
    wrap.innerHTML = html;

    document.querySelectorAll(".option").forEach(el=>{
        el.onclick = function(){
            const qidx = this.dataset.q;
            const userAns = this.dataset.ans;
            const rightAns = data.questions[qidx].answer;
            const allOpt = document.querySelectorAll(`.option[data-q="${qidx}"]`);
            allOpt.forEach(o=>{
                o.classList.remove("right","wrong");
                if(o.dataset.ans === rightAns) o.classList.add("right");
            })
            if(userAns !== rightAns) this.classList.add("wrong");
            document.getElementById("an"+qidx).style.display="block";
        }
    })
}
const SITE_ROOT = "https://hnck668.github.io/physics-quiz/";
const urlParams = new URLSearchParams(window.location.search);
const date = urlParams.get('date');
const container = document.getElementById("question-container");

if (!date) {
  container.innerHTML = '<div style="color:red;padding:20px;">缺少日期参数</div>';
} else {
  fetch(`${SITE_ROOT}questions-${date}.json`)
    .then(res => {
      if (!res.ok) {
        throw new Error(`请求失败，状态码：${res.status}`);
      }
      return res.text();
    })
    .then(rawText => {
      try {
        const data = JSON.parse(rawText);
        renderQuiz(data);
      } catch (parseErr) {
        throw new Error(`JSON解析失败：${parseErr.message}`);
      }
    })
    .catch(err => {
      container.innerHTML = `<div style="color:red;padding:20px;font-size:16px;">
      ❌ 加载错题失败：<br>${err.message}<br>
      完整请求地址：${SITE_ROOT}questions-${date}.json
      </div>`;
    });
}
</script>
</body>
</html>
