<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陈佳怡九年级错题练习 - 首页</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#f5f7fb;padding:20px}
.card{background:#fff;border-radius:14px;padding:22px;margin-bottom:16px;box-shadow:0 2px 8px #00000012}
h1{font-size:24px;color:#222;margin-bottom:16px}
a{display:block;padding:14px;margin:10px 0;background:#e8f4ff;border-radius:10px;color:#2078c9;text-decoration:none;font-size:16px}
a:active{background:#d7eaff}
</style>
</head>
<body>
<div class="card">
<h1>📖 错题练习汇总</h1>
<div id="list"></div>
</div>
<script>
const SITE_ROOT = "https://hnck668.github.io/physics-quiz/";
const dateList = ["2026-11-07","2026-11-08"];
const wrap = document.getElementById("list");
dateList.forEach(d=>{
    wrap.innerHTML += `<a href="${SITE_ROOT}quiz.html?date=${d}">📅 ${d} 错题练习</a>`
})
</script>
</body>
</html>
