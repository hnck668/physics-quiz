<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物理错题练习</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="header">
    <h2>九年级物理错题练习</h2>
    <p class="date-info" id="dateInfo"></p>
  </div>
  <div id="quizBox"></div>
  <button id="submitBtn">提交答卷</button>
  <div id="resultBox"></div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const date = params.get('date');
document.getElementById('dateInfo').textContent = '练习日期：' + date;

let questions = [];
fetch(`questions-${date}.json`)
  .then(res => res.json())
  .then(data => {
    questions = data;
    renderQuiz();
  });

function renderQuiz(){
  const box = document.getElementById('quizBox');
  box.innerHTML = '';
  questions.forEach((q, idx) => {
    let html = `<div class="q-item"><div class="q-title">${idx+1}. ${q.question}</div>`;
    q.options.forEach((opt, i) => {
      const type = q.type === 'multi' ? 'checkbox' : 'radio';
      const val = String.fromCharCode(65+i);
      html += `<label class="opt"><input type="${type}" name="q${idx}" value="${val}"> ${val}. ${opt}</label>`;
    });
    html += `<div class="ans-hint" id="hint${idx}" style="display:none"></div></div>`;
    box.innerHTML += html;
  });
}

document.getElementById('submitBtn').onclick = function(){
  let score = 0;
  const total = questions.length;
  questions.forEach((q, idx) => {
    const inputs = document.querySelectorAll(`input[name="q${idx}"]:checked`);
    let userAns = '';
    inputs.forEach(i => userAns += i.value);
    userAns = userAns.split('').sort().join('');
    const rightAns = q.answer.split('').sort().join('');
    const hint = document.getElementById(`hint${idx}`);
    if(userAns === rightAns){
      score++;
      hint.innerHTML = `✅ 正确<br>解析：${q.desc}`;
      hint.style.color = "#228b22";
    }else{
      hint.innerHTML = `❌ 错误，标准答案：${q.answer}<br>解析：${q.desc}`;
      hint.style.color = "#dc2626";
    }
    hint.style.display = "block";
  });
  document.getElementById('resultBox').innerHTML = `<h3>得分：${score}/${total}</h3>`;
}
</script>
</body>
</html>
